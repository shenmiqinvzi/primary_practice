server:
  port: 8080

spring:
  application:
    name: sky-take-out
  mvc:
    pathmatch:
      # 必须！Spring Boot 2.7 默认是新匹配器，springfox 3.0 只认旧的 ant_path_matcher
      # 不加这行 Knife4j 启动时就崩溃（NullPointerException）
      matching-strategy: ant_path_matcher
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 【重要】改成你自己的 MySQL 用户名和密码！
    url: jdbc:mysql://localhost:3306/sky_take_out?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: HFhy192045*

mybatis:
  # mapper 的 XML 文件放在 resources/mapper 目录下
  mapper-locations: classpath:mapper/*.xml
  # 实体类的包路径，XML 里写 resultType 时可以只用类名
  type-aliases-package: com.sky.entity
  configuration:
    # 数据库下划线字段 自动映射成 驼峰属性：id_number -> idNumber
    map-underscore-to-camel-case: true

sky:
  jwt:
    # 管理端（员工）令牌配置
    admin-secret-key: sky-admin-secret-key   # 签名密钥（生产环境要换复杂随机值）
    admin-ttl: 7200000                        # 有效期 2 小时（毫秒）
    admin-token-name: token                   # 前端存放令牌的请求头名称

logging:
  level:
    com.sky: debug   # 打印 SQL 日志，方便学习观察
